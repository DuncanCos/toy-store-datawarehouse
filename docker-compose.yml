services:
  minio:
    image: minio/minio:latest
    container_name: toystore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: toystore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/bronze &&
      mc mb --ignore-existing myminio/silver &&
      mc mb --ignore-existing myminio/gold &&
      exit 0
      "

  spark-master:
    image: apache/spark:3.5.1
    container_name: toystore-spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ${DATA_PATH:-./data/raw}:/opt/spark-data/raw:ro
      - spark_data:/opt/spark-data/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker:
    image: apache/spark:3.5.1
    container_name: toystore-spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ${DATA_PATH:-./data/raw}:/opt/spark-data/raw:ro
      - spark_data:/opt/spark-data/processed

  pipeline:
    build:
      context: ./docker/pipeline
    container_name: toystore-pipeline
    depends_on:
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RAW_DIR: /opt/spark-data/raw
      SILVER_DIR: /opt/spark-data/processed/silver
      GOLD_DIR: /opt/spark-data/processed/gold
      OUTPUT_DIR: /opt/output
    volumes:
      - ${DATA_PATH:-./data/raw}:/opt/spark-data/raw:ro
      - spark_data:/opt/spark-data/processed
      - ./output:/opt/output
      - ./src:/app/src:ro
    ports:
      - "8080:8080"

volumes:
  minio_data:
  spark_data:

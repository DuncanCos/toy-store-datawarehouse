# All three Spark services share one image: the executors on spark-worker
# need the S3A jars just as much as the driver does.
x-spark-image: &spark-image
  build:
    context: ./docker/spark
  image: toystore-spark:local

x-minio-env: &minio-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

services:
  minio:
    image: minio/minio:latest
    container_name: toystore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: toystore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/bronze &&
      mc mb --ignore-existing myminio/silver &&
      mc mb --ignore-existing myminio/gold &&
      exit 0
      "

  spark-master:
    <<: *spark-image
    container_name: toystore-spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      <<: *minio-env
    ports:
      - "8081:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker:
    <<: *spark-image
    container_name: toystore-spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *minio-env
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      spark-master:
        condition: service_healthy

  pipeline:
    <<: *spark-image
    container_name: toystore-pipeline
    user: root
    command: ["/app/run_pipeline.sh"]
    depends_on:
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-env
      SPARK_MASTER_URL: spark://spark-master:7077
      # Raw CSVs are read from the host only once, by the bronze ingestion.
      # Every layer after that reads and writes s3a:// paths on MinIO.
      RAW_DIR: /opt/spark-data/raw
      BRONZE_URI: s3a://bronze/toy_store/raw
      SILVER_URI: s3a://silver/toy_store
      GOLD_URI: s3a://gold/toy_store
      GOLD_BUCKET: gold
      GOLD_CSV_PREFIX: toy_store/csv
      OUTPUT_DIR: /opt/output
    volumes:
      - ${DATA_PATH:-./data/raw}:/opt/spark-data/raw:ro
      - ./output:/opt/output
      - ./src:/app/src:ro
    ports:
      - "8080:8080"

volumes:
  minio_data:
